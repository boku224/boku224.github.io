<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif">
  <defs>
    <radialGradient id="ga" cx="20%" cy="15%" r="60%">
      <stop offset="0" stop-color="#5ee6c3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5ee6c3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gb" cx="85%" cy="90%" r="60%">
      <stop offset="0" stop-color="#c084fc" stop-opacity=".2"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ee6c3" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5ee6c3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="800" fill="#07090d"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <rect width="1280" height="800" fill="url(#ga)"/>
  <rect width="1280" height="800" fill="url(#gb)"/>

  <!-- ウィンドウ -->
  <g transform="translate(110 70)">
    <rect width="1060" height="660" rx="18" fill="#10141c" stroke="#ffffff" stroke-opacity=".14"/>
    <!-- タイトルバー -->
    <path d="M0 18a18 18 0 0 1 18-18h1024a18 18 0 0 1 18 18v32H0z" fill="#0c1017"/>
    <circle cx="26" cy="25" r="6" fill="#ff6b6b" opacity=".8"/>
    <circle cx="46" cy="25" r="6" fill="#f0d264" opacity=".8"/>
    <circle cx="66" cy="25" r="6" fill="#5ee6c3" opacity=".8"/>
    <rect x="380" y="13" width="300" height="24" rx="12" fill="#ffffff" fill-opacity=".05"/>
    <text x="530" y="30" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#828a99">ops.example.com</text>
    <line x1="0" y1="50" x2="1060" y2="50" stroke="#ffffff" stroke-opacity=".07"/>

    <!-- サイドバー -->
    <rect x="0" y="50" width="200" height="610" fill="#0c1017"/>
    <path d="M0 640v2a18 18 0 0 0 18 18h182V640z" fill="#0c1017"/>
    <text x="28" y="96" font-family="'Space Grotesk','JetBrains Mono',monospace" font-size="20" font-weight="700" fill="#e6e9ef">Ops<tspan fill="#5ee6c3">.</tspan></text>
    <g font-size="15" fill="#828a99">
      <rect x="16" y="122" width="168" height="36" rx="9" fill="#5ee6c3" fill-opacity=".12"/>
      <rect x="16" y="122" width="3" height="36" rx="1.5" fill="#5ee6c3"/>
      <text x="36" y="146" fill="#e6e9ef" font-weight="700">ホーム</text>
      <text x="36" y="192">ログ</text>
      <text x="36" y="236">エラー</text>
      <text x="36" y="280">データベース</text>
      <text x="36" y="324">バックアップ</text>
      <text x="36" y="368">デプロイ</text>
      <text x="36" y="412">セキュリティ</text>
      <text x="36" y="456">設定</text>
    </g>
    <rect x="148" y="221" width="26" height="20" rx="10" fill="#c084fc" fill-opacity=".22"/>
    <text x="161" y="236" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="12" fill="#c084fc">3</text>

    <!-- 見出し -->
    <text x="236" y="102" font-size="24" font-weight="700" fill="#e6e9ef">ホーム</text>
    <g transform="translate(910 82)">
      <rect width="120" height="30" rx="15" fill="#5ee6c3" fill-opacity=".12" stroke="#5ee6c3" stroke-opacity=".4"/>
      <circle cx="20" cy="15" r="5" fill="#5ee6c3"/>
      <text x="34" y="20" font-size="14" fill="#5ee6c3">稼働中</text>
    </g>

    <!-- 状態のタイル -->
    <g font-family="'JetBrains Mono',Consolas,monospace">
      <g transform="translate(236 130)">
        <rect width="186" height="96" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".07"/>
        <text x="18" y="30" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="13" fill="#828a99">CPU</text>
        <text x="18" y="70" font-size="30" font-weight="700" fill="#e6e9ef">23<tspan font-size="16" fill="#828a99">%</tspan></text>
        <rect x="104" y="56" width="64" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/>
        <rect x="104" y="56" width="15" height="6" rx="3" fill="#5ee6c3"/>
      </g>
      <g transform="translate(436 130)">
        <rect width="186" height="96" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".07"/>
        <text x="18" y="30" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="13" fill="#828a99">メモリ</text>
        <text x="18" y="70" font-size="30" font-weight="700" fill="#e6e9ef">41<tspan font-size="16" fill="#828a99">%</tspan></text>
        <rect x="104" y="56" width="64" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/>
        <rect x="104" y="56" width="26" height="6" rx="3" fill="#7aa2ff"/>
      </g>
      <g transform="translate(636 130)">
        <rect width="186" height="96" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".07"/>
        <text x="18" y="30" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="13" fill="#828a99">ディスク</text>
        <text x="18" y="70" font-size="30" font-weight="700" fill="#e6e9ef">58<tspan font-size="16" fill="#828a99">%</tspan></text>
        <rect x="104" y="56" width="64" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/>
        <rect x="104" y="56" width="37" height="6" rx="3" fill="#f0d264"/>
      </g>
      <g transform="translate(836 130)">
        <rect width="194" height="96" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".07"/>
        <text x="18" y="30" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="13" fill="#828a99">バックアップ</text>
        <text x="18" y="62" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="20" font-weight="700" fill="#e6e9ef">今朝 5:00</text>
        <text x="18" y="84" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="13" fill="#5ee6c3">✓ 外部へ退避済み</text>
      </g>
    </g>

    <!-- グラフ -->
    <g transform="translate(236 246)">
      <rect width="460" height="250" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="20" y="34" font-size="14" fill="#e6e9ef" font-weight="700">応答時間（24 時間）</text>
      <text x="440" y="34" text-anchor="end" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#828a99">avg 42 ms</text>
      <g stroke="#ffffff" stroke-opacity=".06">
        <line x1="20" y1="90" x2="440" y2="90"/>
        <line x1="20" y1="140" x2="440" y2="140"/>
        <line x1="20" y1="190" x2="440" y2="190"/>
      </g>
      <path d="M20 170 L55 162 L90 166 L125 150 L160 156 L195 140 L230 146 L265 118 L300 132 L335 126 L370 138 L405 120 L440 128 L440 226 L20 226 Z" fill="url(#area)"/>
      <path d="M20 170 L55 162 L90 166 L125 150 L160 156 L195 140 L230 146 L265 118 L300 132 L335 126 L370 138 L405 120 L440 128" fill="none" stroke="#5ee6c3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="440" cy="128" r="6" fill="#07090d" stroke="#5ee6c3" stroke-width="3"/>
    </g>

    <!-- エラーと AI 解析 -->
    <g transform="translate(716 246)">
      <rect width="314" height="250" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="20" y="34" font-size="14" fill="#e6e9ef" font-weight="700">新しいエラー</text>
      <g font-size="13">
        <g transform="translate(20 56)">
          <rect width="274" height="52" rx="9" fill="#c084fc" fill-opacity=".08" stroke="#c084fc" stroke-opacity=".35"/>
          <text x="14" y="22" fill="#e6e9ef">設定ファイルを読めません</text>
          <text x="14" y="40" fill="#c084fc">AI: 権限が 600 になっています</text>
        </g>
        <g transform="translate(20 118)">
          <rect width="274" height="52" rx="9" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".07"/>
          <text x="14" y="22" fill="#e6e9ef">テーブルがありません</text>
          <text x="14" y="40" fill="#828a99">AI: 移行で漏れたテーブルです</text>
        </g>
        <g transform="translate(20 180)">
          <rect width="274" height="52" rx="9" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".07"/>
          <text x="14" y="22" fill="#e6e9ef">SSH のログイン失敗が続いています</text>
          <text x="14" y="40" fill="#828a99">AI: 総当たりの攻撃です</text>
        </g>
      </g>
    </g>

    <!-- 時系列 -->
    <g transform="translate(236 516)">
      <rect width="794" height="118" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="20" y="34" font-size="14" fill="#e6e9ef" font-weight="700">時系列</text>
      <line x1="20" y1="76" x2="774" y2="76" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
      <g font-family="'JetBrains Mono',Consolas,monospace" font-size="12" fill="#828a99">
        <circle cx="90" cy="76" r="7" fill="#5ee6c3"/><text x="90" y="104" text-anchor="middle">05:00 backup</text>
        <circle cx="280" cy="76" r="7" fill="#7aa2ff"/><text x="280" y="104" text-anchor="middle">08:00 report</text>
        <circle cx="470" cy="76" r="7" fill="#f0d264"/><text x="470" y="104" text-anchor="middle">13:12 deploy #12</text>
        <circle cx="660" cy="76" r="7" fill="#5ee6c3"/><text x="660" y="104" text-anchor="middle">13:22 watch ok</text>
      </g>
    </g>
  </g>
</svg>
